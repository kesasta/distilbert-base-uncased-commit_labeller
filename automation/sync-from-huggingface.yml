name: Sync from Hugging Face

on:
  schedule:
    # Poll away from the top of the hour, when scheduled Actions are busiest.
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: huggingface-to-github-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Import Hugging Face commits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the GitHub integration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Check Git LFS availability
        run: git lfs version

      - name: Fetch, validate, and publish upstream changes
        env:
          HF_REPOSITORY: https://huggingface.co/eyinlojuoluwa/distilbert-base-uncased-commit_labeller
          HF_BRANCH: main
          TARGET_BRANCH: main
          MIRROR_BRANCH: huggingface-main
        run: .github/scripts/sync-from-huggingface.sh
